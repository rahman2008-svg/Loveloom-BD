<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editor - LoveLoom BD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div class="max-w-2xl mx-auto p-4">
    <h1 class="text-3xl font-bold text-center my-6" id="pageTitle">টেমপ্লেট এডিটর</h1>

    <div id="formContainer" class="space-y-6"></div>

    <div class="mt-8 flex gap-4">
      <button onclick="generateLink()" class="flex-1 bg-pink-600 text-white py-4 rounded-2xl font-semibold text-lg">
        লিংক জেনারেট করুন
      </button>
      <button onclick="toggleDarkMode()" class="px-6 bg-gray-200 dark:bg-gray-700 rounded-2xl">
        🌙
      </button>
    </div>

    <div id="preview" class="mt-10 border rounded-3xl p-4 bg-white dark:bg-gray-800 shadow"></div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/templates.js"></script>
</body>
</html>
