<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LoveLoom BD - প্রেমের উপহার</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-50 to-purple-100 dark:from-gray-900 dark:to-purple-950 min-h-screen">
  <div class="max-w-4xl mx-auto p-4">
    <h1 class="text-4xl font-bold text-center my-8 text-pink-600">❤️ LoveLoom BD</h1>
    <p class="text-center text-gray-600 dark:text-gray-400 mb-10">তোমার ভালোবাসা এক ক্লিকে সুন্দর করে তুলুন</p>

    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <a href="editor.html?type=love-message" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow hover:shadow-xl transition">
        <h3 class="text-xl font-semibold">Love Message</h3>
      </a>
      <a href="editor.html?type=birthday" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow hover:shadow-xl transition">
        <h3 class="text-xl font-semibold">Birthday Card</h3>
      </a>
      <a href="editor.html?type=qr-code" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow hover:shadow-xl transition">
        <h3 class="text-xl font-semibold">Love QR Code</h3>
      </a>
      <a href="editor.html?type=spin-wheel" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow hover:shadow-xl transition">
        <h3 class="text-xl font-semibold">Spin Wheel</h3>
      </a>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
